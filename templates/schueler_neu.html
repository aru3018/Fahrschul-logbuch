{% extends "base.html" %}
{% block title %}Neuer Schüler · Start Drive Fahrschule{% endblock %}
{% block content %}

<div class="page-head">
    <h1>Neuen Schüler anlegen</h1>
    <a href="{{ url_for('index') }}" class="btn btn-ghost">← Zurück</a>
</div>

<form method="post" class="card form">
    <div class="form-row">
        <label>Vorname
            <input type="text" name="vorname" required>
        </label>
        <label>Nachname
            <input type="text" name="nachname" required>
        </label>
    </div>
    <div class="form-row">
        <label>E-Mail
            <input type="email" name="email">
        </label>
        <label>Telefon
            <input type="tel" name="telefon">
        </label>
    </div>
    <label>Lernfahrausweis-Nr. (optional)
        <input type="text" name="lernfahrausweis_nr">
    </label>
    <div class="form-row">
        <label>Fahrzeug
            <select name="fahrzeug" id="fahrzeug-auswahl">
                <option value="">– kein Fahrzeug zugewiesen –</option>
                {% for name in fahrzeuge %}
                <option value="{{ name }}">{{ name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Getriebe
            <select name="getriebe" id="getriebe-auswahl">
                <option value="">–</option>
                <option value="Automatik">Automatik</option>
                <option value="Geschaltet">Geschaltet</option>
            </select>
        </label>
    </div>
    <button type="submit" class="btn btn-primary">Speichern</button>
</form>

<script>
const FAHRZEUG_GETRIEBE = {{ fahrzeuge|tojson }};
document.getElementById("fahrzeug-auswahl").addEventListener("change", function () {
    const getriebe = FAHRZEUG_GETRIEBE[this.value];
    if (getriebe) {
        document.getElementById("getriebe-auswahl").value = getriebe;
    }
});
</script>

{% endblock %}
