<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Start Drive Fahrschule{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a href="{{ url_for('index') }}" class="brand">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Start Drive Fahrschule" class="brand-logo">
        </a>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
