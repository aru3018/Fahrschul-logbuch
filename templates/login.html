<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anmelden · Fahrschule Bern</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Fahrschule Bern" class="login-logo">
            <h1 class="login-title">Anmelden</h1>

            {% if fehler %}
            <p class="login-fehler">{{ fehler }}</p>
            {% endif %}

            <form method="post" class="form">
                <input type="hidden" name="weiter" value="{{ weiter }}">
                <label>Benutzername
                    <input type="text" name="benutzername" required autofocus autocomplete="username">
                </label>
                <label>Passwort
                    <input type="password" name="passwort" required autocomplete="current-password">
                </label>
                <button type="submit" class="btn btn-primary login-btn">Anmelden</button>
            </form>
            <p class="login-footer-link">
                <a href="{{ url_for('passwort_vergessen') }}">Passwort vergessen?</a>
            </p>
        </div>
    </div>
</body>
</html>
