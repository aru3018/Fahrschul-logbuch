{% extends "base.html" %}
{% block title %}{{ schueler.vorname }} bearbeiten · Start Drive Fahrschule{% endblock %}
{% block content %}

<div class="page-head">
    <h1>Schüler bearbeiten</h1>
    <a href="{{ url_for('schueler_detail', schueler_id=schueler.id) }}" class="btn btn-ghost">← Zurück</a>
</div>

<form method="post" class="card form">
    <div class="form-row">
        <label>Vorname
            <input type="text" name="vorname" value="{{ schueler.vorname }}" required>
        </label>
        <label>Nachname
            <input type="text" name="nachname" value="{{ schueler.nachname }}" required>
        </label>
    </div>
    <div class="form-row">
        <label>E-Mail
            <input type="email" name="email" value="{{ schueler.email or '' }}">
        </label>
        <label>Telefon
            <input type="tel" name="telefon" value="{{ schueler.telefon or '' }}">
        </label>
    </div>
    <div class="form-row">
        <label>Lernfahrausweis-Nr.
            <input type="text" name="lernfahrausweis_nr" value="{{ schueler.lernfahrausweis_nr or '' }}">
        </label>
        <label>Status
            <select name="status">
                <option value="aktiv" {% if schueler.status == 'aktiv' %}selected{% endif %}>Aktiv</option>
                <option value="pausiert" {% if schueler.status == 'pausiert' %}selected{% endif %}>Pausiert</option>
                <option value="pruefung_bestanden" {% if schueler.status == 'pruefung_bestanden' %}selected{% endif %}>Prüfung bestanden</option>
            </select>
        </label>
    </div>
    <div class="form-row">
        <label>Fahrzeug
            <select name="fahrzeug" id="fahrzeug-auswahl">
                <option value="" {% if not schueler.fahrzeug %}selected{% endif %}>– kein Fahrzeug zugewiesen –</option>
                {% for name in fahrzeuge %}
                <option value="{{ name }}" {% if schueler.fahrzeug == name %}selected{% endif %}>{{ name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Getriebe
            <select name="getriebe" id="getriebe-auswahl">
                <option value="" {% if not schueler.getriebe %}selected{% endif %}>–</option>
                <option value="Automatik" {% if schueler.getriebe == 'Automatik' %}selected{% endif %}>Automatik</option>
                <option value="Geschaltet" {% if schueler.getriebe == 'Geschaltet' %}selected{% endif %}>Geschaltet</option>
            </select>
        </label>
    </div>
    <button type="submit" class="btn btn-primary">Speichern</button>
</form>

<script>
const FAHRZEUG_GETRIEBE = {{ fahrzeuge|tojson }};
document.getElementById("fahrzeug-auswahl").addEventListener("change", function () {
    const getriebe = FAHRZEUG_GETRIEBE[this.value];
    if (getriebe) {
        document.getElementById("getriebe-auswahl").value = getriebe;
    }
});
</script>

{% endblock %}
